<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><meta name="theme-color" content="#0e2530"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="VINISWIM"/><meta name="application-name" content="VINISWIM"/><title>VINISWIM Performance Tracker</title><link rel="manifest" href="./manifest.webmanifest"/><link rel="apple-touch-icon" href="../apple-touch-icon.png"/><link rel="icon" href="../apple-touch-icon.png"/>  <script type="module" crossorigin src="./assets/index-BkroQ4_-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DEuLsUqQ.css">
</head><body><div id="root"><div id="boot-status" style="font-family:Inter,system-ui,sans-serif;padding:24px;color:#17252d">Carregando VINISWIM...</div></div><script>
window.__viniswimBooted=false;
(function(){
  function show(msg){
    if(window.__viniswimBooted)return;
    var root=document.getElementById('root');
    if(!root)return;
    root.innerHTML='<div style="font-family:Inter,system-ui,sans-serif;padding:24px;color:#8b1e2d;white-space:pre-wrap"><b>Falha ao iniciar o VINISWIM</b><br><br>'+String(msg).replace(/[&<>]/g,function(s){return({'&':'&amp;','<':'&lt;','>':'&gt;'})[s]})+'</div>';
  }
  window.addEventListener('error',function(e){show((e.message||'Erro de carregamento')+(e.filename?'\n'+e.filename:'')+(e.lineno?'\nlinha '+e.lineno:'') )});
  window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message?e.reason.message:String(e.reason||'Promise rejeitada'))});
  setTimeout(function(){if(!window.__viniswimBooted)show('O JavaScript principal não concluiu a inicialização em 8 segundos.')},8000);
})();
</script></body></html>
