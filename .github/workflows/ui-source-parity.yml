name: VINISWIM UI Source Parity
on:
  push:
    branches:
      - ui/unified-dashboard-gate2
    paths:
      - 'commercial-src.zip'
      - 'app/index.html'
      - 'app/assets/**'
      - 'scripts/check-ui-consolidation-gate2.cjs'
      - '.github/workflows/ui-source-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit packaged editable source and bundled app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, sys
          index=Path('app/index.html').read_text()
          bundle_name=re.search(r'\./assets/([^"\']+\.js)',index)
          if not bundle_name: raise SystemExit('FAIL: app/index.html has no JS bundle')
          bundle=Path('app/assets',bundle_name.group(1)).read_text()
          with ZipFile('commercial-src.zip') as z:
              names=z.namelist()
              source_names=[n for n in names if n.endswith('/apps/web/src/App.tsx')]
              if len(source_names)!=1: raise SystemExit(f'FAIL: expected unique App.tsx inside zip, got {source_names}')
              app=z.read(source_names[0]).decode('utf-8')
              print(f'App.tsx in archive: {source_names[0]}, size={len(app)}')
              print(f'Production bundle: {bundle_name.group(1)}, size={len(bundle)}')
              probes={
                'editable source contains Campeonatos section':'Campeonatos' in app,
                'editable source contains Expectativas section':'Expectativas' in app,
                'editable source has current import-v2 call':'request_result_refresh_v2' in app,
                'editable source removes standalone Campeonatos route':not re.search(r'["\']meets["\']\s*,\s*["\']Campeonatos["\']', app),
                'editable source removes standalone Expectativas route':not re.search(r'["\']expectations["\']\s*,\s*["\']Expectativas["\']', app),
                'edited bundle has unified dashboard': 'A==="dashboard"&&y.jsxs(y.Fragment' in bundle,
                'edited bundle has no standalone meets route':'A==="meets"&&' not in bundle,
                'edited bundle has no standalone expectations route':'A==="expectations"&&' not in bundle,
              }
              for name, ok in probes.items(): print(('PASS' if ok else 'FAIL')+': '+name)
              if not all(probes.values()): raise SystemExit('Source parity BLOCKED: source archive cannot be treated as validated current source.')
          PY
          node scripts/check-ui-consolidation-gate2.cjs
