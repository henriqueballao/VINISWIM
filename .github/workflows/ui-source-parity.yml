name: VINISWIM UI Gate 2 (source and build)
on:
  push:
    branches:
      - ui/unified-dashboard-gate2
    paths:
      - 'commercial/apps/web/src/**'
      - 'commercial/apps/web/package.json'
      - 'commercial/package.json'
      - 'app/index.html'
      - 'app/assets/**'
      - 'scripts/check-ui-consolidation-gate2.cjs'
      - '.github/workflows/ui-source-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit editable React source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('commercial/apps/web/src/App.tsx').read_text()
          checks={
            'four routes':"type Page='dashboard'|'results'|'evolution'|'settings'" in s,
            'old menu items removed':"['meets','Campeonatos'" not in s and "['expectations','Expectativas'" not in s,
            'unified dashboard components':"{page==='dashboard'&&<><Dashboard" in s and '<MeetsPage meets={meets}' in s and '<Expectations results={results}' in s,
            'old route renders removed':"{page==='meets'&&" not in s and "{page==='expectations'&&" not in s,
            'V2 retained':'request_result_refresh_v2' in s,
            'source meets retained':'function MeetsPage(' in s,
            'source expectations retained':'function Expectations(' in s,
            'manual result retention':"origin==='manual'" in s,
            'secure official link':'rel="noopener noreferrer"' in s,
            'source HTTPS link':"/^https:\\/\\//i.test(m.official_url)" in s,
            'top three PBs':'pbs.slice(0,3).map' in s,
            'next championship highlighted once':'m.id===nextMeetId' in s and 'meet-next-label' in s,
            'next championship date order':"String(a.start_date||'').localeCompare" in s,
            'no duplicated dashboard next championship':'function Dashboard(' in s and '<h3>Próximo campeonato</h3>' not in s,
            'no invented per-event URL':'/events/' not in s and '/balizamento/' not in s,
          }
          for label,ok in checks.items():print(('PASS' if ok else 'FAIL')+' '+label)
          if not all(checks.values()):raise SystemExit('Gate 2 source verification failed')
          PY
      - name: Install dependencies (no deployment)
        working-directory: commercial
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check and build React source
        working-directory: commercial
        run: npm run build:web
      - name: Check isolated experimental bundle
        run: node scripts/check-ui-consolidation-gate2.cjs
