name: Dropbox session persistence test
on:
  push:
    paths:
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/dropbox-session-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run persistence test
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const ctx = await browser.newContext({serviceWorkers:'block'});
            const page = await ctx.newPage();

            const dataset = {
              app:'VINISWIM',
              athlete:{name:'Vinícius Suzin Ballão',registration:'422692',birthDate:'2015-09-30',category:'Petiz I',club:'Clube Curitibano'},
              settings:{athleteRegistration:'422692',athleteName:'Vinícius Suzin Ballão',team:'Clube Curitibano',birthDate:'2015-09-30',category:'Petiz I',pushServerUrl:'',alerts:{}},
              results:[],meets:[],sources:[],audit:{}
            };

            let uploaded=null;
            await page.route('https://content.dropboxapi.com/2/files/download', async route=>{
              await route.fulfill({status:200,headers:{'content-type':'application/json','Dropbox-API-Result':'{"rev":"testrev"}'},body:JSON.stringify(dataset)});
            });
            await page.route('https://content.dropboxapi.com/2/files/upload', async route=>{
              uploaded=JSON.parse(route.request().postData());
              await route.fulfill({status:200,contentType:'application/json',body:'{"rev":"migration-rev"}'});
            });
            await page.route('https://api.dropboxapi.com/oauth2/token', async route=>{
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({access_token:'refreshed-token',expires_in:14400,token_type:'bearer'})});
            });
            await page.route('https://viniswim-monitor.onrender.com/**', async route=>{
              await route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"results":[]}'});
            });

            await page.goto('https://henriqueballao.github.io/VINISWIM/',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              localStorage.setItem('viniswim_dbx_access_v1','persisted-token');
              localStorage.setItem('viniswim_dbx_access_expires_v1',String(Date.now()+3600000));
              localStorage.setItem('viniswim_local_data_v1',JSON.stringify({app:'VINISWIM',athlete:{name:'Vinícius Suzin Ballão'},settings:{},results:[],meets:[],sources:[],audit:{}}));
            });
            await page.reload();
            await page.waitForTimeout(1500);
            console.log('LIVE_BUILD',await page.evaluate(()=>document.querySelector('#footerBuild')?.textContent||''));

            let state = await page.evaluate(()=>({
              status:document.querySelector('#sidebarSyncStatus')?.textContent||'',
              recoveryHidden:document.querySelector('#dropboxRecoveryPanel')?.hidden,
              access:localStorage.getItem('viniswim_dbx_access_v1'),
              build:typeof VINISWIM_BUILD!=='undefined'?VINISWIM_BUILD:'',
              histCount:(DATA.results||[]).filter(r=>String(r.date||'')<='2026-08-16').length,
              total:(DATA.results||[]).length,
              mar100:(DATA.results||[]).find(r=>r.migration==='historical35-v1'&&r.event==='100 Livre'&&r.date==='2025-03-22')?.timeSeconds,
              octFly:(DATA.results||[]).find(r=>r.migration==='historical35-v1'&&r.event==='50 Borboleta'&&r.date==='2025-10-11')?.timeSeconds,
              aug100:(DATA.results||[]).find(r=>r.migration==='historical35-v1'&&r.event==='100 Livre'&&r.date==='2026-08-16')?.timeSeconds,
              cat2025:categoryForDate('2025-09-13'),
              cat2026:categoryForDate('2026-08-16'),
              marker:DATA.audit?.historical35Version
            }));
            console.log('FIRST_OPEN',state);
            assert(!/reconectar/i.test(state.status),'First open asked to reconnect');
            assert.strictEqual(state.recoveryHidden,true,'Recovery panel visible on first open');
            assert.strictEqual(state.build,'53','Live app is not V53');
            assert.strictEqual(state.histCount,35,'Historical migration did not produce 35 results');
            assert.strictEqual(state.total,35,'Unexpected result count in migration fixture');
            assert.strictEqual(state.mar100,131.61,'March 2025 precise time mismatch');
            assert.strictEqual(state.octFly,68.83,'October 2025 precise time mismatch');
            assert.strictEqual(state.aug100,100.92,'August 2026 precise time mismatch');
            assert.strictEqual(state.cat2025,'Mirim 2','2025 category mismatch');
            assert.strictEqual(state.cat2026,'Petiz I','2026 category mismatch');
            assert.strictEqual(state.marker,1,'Historical migration marker missing');
            assert(uploaded,'Dropbox migration upload was not attempted');
            assert.strictEqual(uploaded.results.filter(r=>String(r.date||'')<='2026-08-16').length,35,'Uploaded Dropbox history is not 35 results');
            assert.strictEqual(uploaded.settings.categoryByYear['2025'],'Mirim 2');
            assert.strictEqual(uploaded.settings.categoryByYear['2026'],'Petiz I');
            await page.evaluate(()=>nav('evolution',{persist:false}));
            await page.waitForTimeout(100);
            const evo=await page.locator('#evolutionStats').innerText();
            assert(evo.includes('Evolução esportiva observada'),'Category-aware evolution text missing');
            assert(evo.includes('Mirim 2')&&evo.includes('Petiz I'),'Category transition missing from evolution analysis');

            await page.close();
            const page2 = await ctx.newPage();
            await page2.route('https://content.dropboxapi.com/2/files/download', async route=>{
              await route.fulfill({status:200,headers:{'content-type':'application/json','Dropbox-API-Result':'{"rev":"testrev2"}'},body:JSON.stringify(dataset)});
            });
            await page2.route('https://api.dropboxapi.com/oauth2/token', async route=>{
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({access_token:'refreshed-token-2',expires_in:14400,token_type:'bearer'})});
            });
            await page2.route('https://viniswim-monitor.onrender.com/**', async route=>{
              await route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"results":[]}'});
            });
            await page2.goto('https://henriqueballao.github.io/VINISWIM/',{waitUntil:'domcontentloaded'});
            await page2.waitForTimeout(1500);
            state = await page2.evaluate(()=>({
              status:document.querySelector('#sidebarSyncStatus')?.textContent||'',
              recoveryHidden:document.querySelector('#dropboxRecoveryPanel')?.hidden,
              access:localStorage.getItem('viniswim_dbx_access_v1')
            }));
            console.log('SECOND_OPEN',state);
            assert(!/reconectar/i.test(state.status),'Second open asked to reconnect');
            assert.strictEqual(state.recoveryHidden,true,'Recovery panel visible on second open');
            assert(state.access,'Access token missing after reopen');

            await page2.evaluate(()=>{
              localStorage.setItem('viniswim_dbx_access_expires_v1',String(Date.now()-1000));
              localStorage.setItem('viniswim_dbx_refresh_v1','refresh-token');
            });
            await page2.reload();
            await page2.waitForTimeout(1800);
            state = await page2.evaluate(()=>({
              status:document.querySelector('#sidebarSyncStatus')?.textContent||'',
              recoveryHidden:document.querySelector('#dropboxRecoveryPanel')?.hidden,
              access:localStorage.getItem('viniswim_dbx_access_v1')
            }));
            console.log('REFRESH_OPEN',state);
            assert(!/reconectar/i.test(state.status),'Refresh flow asked to reconnect');
            assert.strictEqual(state.recoveryHidden,true,'Recovery panel visible after refresh');
            assert.strictEqual(state.access,'refreshed-token-2','Refresh token flow did not replace access token');

            await browser.close();
            console.log('DROPBOX_PERSISTENCE_TEST=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
