name: Official Edge extractor and reproducible build candidate
on:
  push:
    branches: ['fix/official-import-audit-20261011']
    paths: ['commercial/packages/official-worker/**', 'commercial/supabase/functions/official-import-runner/**', 'scripts/test-deno-pdf-extractor.mjs', 'scripts/test-js-pdf-extractor.mjs', 'scripts/capture-official-meets-readonly.mjs', '.github/workflows/official-edge-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  javascript-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install committed locked dependency graph without lifecycle scripts
        working-directory: commercial
        run: npm ci --ignore-scripts
      - name: Worker contracts
        run: node --test commercial/packages/official-worker/src/*.test.mjs
      - name: Validate frontend build from locked graph
        working-directory: commercial
        run: npm run build:web
      - name: Verify and unpack committed original publications
        run: python3 scripts/unpack-official-fixture.py 20261011-1439 original-capture
      - name: Validate original publications with JavaScript PDF extractor
        run: node scripts/test-js-pdf-extractor.mjs original-capture
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check unpublished Edge entry point
        run: deno check --frozen --config commercial/supabase/functions/official-import-runner/deno.json commercial/supabase/functions/official-import-runner/index.ts
      - name: Verify actual Deno extraction runtime with original PDFs
        run: deno run --frozen --config commercial/supabase/functions/official-import-runner/deno.json --allow-read --allow-env --allow-sys scripts/test-deno-pdf-extractor.mjs original-capture
      - name: Preserve lock and candidate build (no deploy)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-edge-build-candidate
          path: |
            commercial/package-lock.json
            commercial/supabase/functions/official-import-runner/deno.lock
            commercial/apps/web/dist
          retention-days: 30
      - name: Capture current and configured historical publications (public read only)
        run: node scripts/capture-official-meets-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-current-and-historical-readonly
          path: official-meet-captures
          retention-days: 90
