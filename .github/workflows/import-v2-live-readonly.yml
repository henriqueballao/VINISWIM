name: Import V2 Live Readonly
on:
  workflow_dispatch:
  push:
    paths:
      - 'commercial/packages/import-v2/**'
      - '.github/workflows/import-v2-live-readonly.yml'
permissions:
  contents: read
jobs:
  source-investigator:
    name: Source Investigator — Gate 2 live discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: commercial/packages/import-v2
        run: npm test
      - name: Live calendar discovery, read-only
        working-directory: commercial/packages/import-v2
        run: node src/live-discovery.mjs
