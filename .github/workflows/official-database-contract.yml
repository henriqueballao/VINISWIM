name: Official database contract (isolated)
on:
  push:
    branches: ['fix/official-import-audit-20261011']
    paths: ['commercial/supabase/proposals/**', 'commercial/supabase/tests/isolated/**', '.github/workflows/official-database-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-contract:
    strategy:
      matrix:
        contract: [event, lease, transaction]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: viniswim_isolated_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SYNTHETIC-CI-ONLY
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce published constraints and verify candidate repair
        env:
          PGPASSWORD: SYNTHETIC-CI-ONLY
        run: psql -h localhost -U postgres -d viniswim_isolated_test -v ON_ERROR_STOP=1 -f commercial/supabase/tests/isolated/${{ matrix.contract }}-contract.sql
